name: "Install dependencies"
description: "Prepare repository and all dependencies"

runs:
  using: "composite"
  steps:
    - name: Set up Bun
      uses: wevm/actions/vendor/oven-sh/setup-bun/v2.2.0@e0e99cfdac7c74eadc3ee7281015c0bf0496d6ac # v1.0.4
      with:
        bun-version: 1.4.4

    - name: Install dependencies
      shell: bash
      run: bun install