name: Verify
on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Lint code
        run: bun run format && bun run lint
      
      - uses: wevm/actions/vendor/stefanzweifel/git-auto-commit-action/v6.0.1@e0e99cfdac7c74eadc3ee7281015c0bf0496d6ac # v1.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: 'chore: format'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

  types:
    name: Types
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        
      - name: Check types
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: ['bun', 'deno', 'node-16', 'node-18', 'node-20', 'node-latest', 'next', 'sveltekit', 'tsc']
        include:
          - type: bun
            runtime: bun
          - type: deno
            runtime: deno
          - type: node-16
            node-version: 16
            runtime: node
          - type: node-18
            node-version: 18
            runtime: node
          - type: node-20
            node-version: 20
            runtime: node
          - type: node-latest
            node-version: latest
            runtime: node
          - type: next
            runtime: next
          - type: sveltekit
            node-version: 20
            runtime: sveltekit
          - type: tsc
            node-version: 20
            runtime: tsc

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: wevm/actions/vendor/oven-sh/setup-bun/v2.2.0@e0e99cfdac7c74eadc3ee7281015c0bf0496d6ac # v1.0.4
        with:
          bun-version: 1.4.4

      - name: Set up Node
        if: ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Deno
        if: ${{ matrix.runtime == 'deno' }}
        uses: wevm/actions/vendor/denoland/setup-deno/v2@e0e99cfdac7c74eadc3ee7281015c0bf0496d6ac # v1.0.4
        with:
          deno-version: 1.x

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install Playwright Browsers
        if: ${{ matrix.runtime == 'next' || matrix.runtime == 'sveltekit' || matrix.runtime == 'vite' }}
        run: npx playwright@1.65.0 install --with-deps

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test:${{ matrix.runtime }}